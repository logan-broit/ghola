# =============================================================================
# Chapterhouse GitLab CI/CD Pipeline
# =============================================================================
# Tests code, builds Docker images, packages Helm charts, and deploys to K8s
# =============================================================================

stages:
  - test
  - build
  - publish
  - deploy

variables:
  GO_VERSION: "1.24"
  REGISTRY: registry.switchcraft.pd.internal/chapterhouse
  IMAGE_PREFIX: ${REGISTRY}
  KUBE_NAMESPACE: ch-system

# =============================================================================
# Test Stage
# =============================================================================
test:
  stage: test
  image: golang:${GO_VERSION}-alpine
  tags:
    - runcell
  before_script:
    # Inject CA bundle before apk — MITM proxy intercepts Alpine mirror TLS
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - cat /usr/local/share/ca-certificates/switch-ca.crt >> /etc/ssl/certs/ca-certificates.crt
    - apk add --no-cache ca-certificates
    - update-ca-certificates
  script:
    - cd ch-server
    - go mod download
    - go vet ./...
    - go test ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ch-server/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/**/*
    - if: $CI_COMMIT_TAG

# =============================================================================
# Build Stage - Docker (BuildKit with docker-container driver)
# =============================================================================
.docker-build:
  stage: build
  image: docker:27
  tags:
    - runcell
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=registry.switchcraft.pd.internal"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    # Verify credentials are set
    - |
      if [ -z "${ZOT_USER}" ]; then
        echo "ERROR: ZOT_USER CI variable not set"
        echo "Go to Settings > CI/CD > Variables and add ZOT_USER"
        exit 1
      fi
      if [ -z "${ZOT_PASSWORD}" ]; then
        echo "ERROR: ZOT_PASSWORD CI variable not set"
        echo "Go to Settings > CI/CD > Variables and add ZOT_PASSWORD"
        exit 1
      fi
    # Inject corporate CA bundle for MITM proxy
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - update-ca-certificates
    # Wait for Docker daemon to be ready (DIND takes time to start)
    - |
      echo "Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker is ready!"
          break
        fi
        echo "  attempt $i/30..."
        sleep 2
      done
      if ! docker info >/dev/null 2>&1; then
        echo "ERROR: Docker daemon not available after 60s"
        exit 1
      fi
    # Login to Zot registry
    - echo "${ZOT_PASSWORD}" | docker login -u "${ZOT_USER}" --password-stdin registry.switchcraft.pd.internal
    # Create buildx builder with docker-container driver.
    # The docker driver delegates push to the DinD daemon which drops auth headers.
    # The docker-container driver runs BuildKit in its own container and receives
    # auth directly from the client session, bypassing DinD's broken push auth.
    # BuildKit needs insecure=true because the container doesn't have the corporate CA.
    - |
      cat > /tmp/buildkitd.toml <<'TOML'
      [registry."registry.switchcraft.pd.internal"]
        insecure = true
      TOML
    - docker buildx create --use --driver docker-container --name ci-builder --buildkitd-config /tmp/buildkitd.toml
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

build-server:
  extends: .docker-build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/**/*
        - ca-bundle.pem
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Building ch-server:${VERSION}"
      docker buildx build --push \
        --platform linux/amd64 \
        -t ${IMAGE_PREFIX}/ch-server:${VERSION} \
        -t ${IMAGE_PREFIX}/ch-server:latest \
        -f ch-server/Dockerfile \
        ch-server/

build-web:
  extends: .docker-build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-web/**/*
        - ca-bundle.pem
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Building ch-web:${VERSION}"
      docker buildx build --push \
        --platform linux/amd64 \
        -t ${IMAGE_PREFIX}/ch-web:${VERSION} \
        -t ${IMAGE_PREFIX}/ch-web:latest \
        -f ch-web/Dockerfile \
        ch-web/

# =============================================================================
# Publish Stage - Helm Charts
# =============================================================================
publish-helm-charts:
  stage: publish
  image: alpine:3.21
  tags:
    - runcell
  before_script:
    # Alpine: append CA to trust store before apk can fetch through MITM proxy
    - mkdir -p /usr/local/share/ca-certificates
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - cat /usr/local/share/ca-certificates/switch-ca.crt >> /etc/ssl/certs/ca-certificates.crt
    - apk add --no-cache curl helm ca-certificates
    - update-ca-certificates
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="0.0.0-${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Chart version: ${VERSION}"

      # Login to Zot OCI registry for helm push
      echo "${ZOT_PASSWORD}" | helm registry login registry.switchcraft.pd.internal -u "${ZOT_USER}" --password-stdin

      mkdir -p dist
      for chart in ch-server/charts/ch-server ch-web/charts/ch-web; do
        if [ ! -f "${chart}/Chart.yaml" ]; then
          echo "Skipping ${chart} (no Chart.yaml)"
          continue
        fi
        chart_name=$(basename "$chart")
        echo "Packaging ${chart_name}..."
        helm package "$chart" --version "${VERSION}" --app-version "${VERSION}" -d dist/

        echo "Pushing ${chart_name}:${VERSION} to OCI registry..."
        helm push "dist/${chart_name}-${VERSION}.tgz" oci://registry.switchcraft.pd.internal/charts
      done
  artifacts:
    paths:
      - dist/*.tgz
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/charts/**/*
        - ch-web/charts/**/*

# =============================================================================
# Deploy Stage
# =============================================================================
# Requires CI variable: KUBE_CONFIG_OVAS (base64-encoded kubeconfig for ovas-ai-prod)
# Generate with: base64 -i ~/.kube/ovas-ai-prod.yaml | tr -d '\n'
# =============================================================================

.deploy-base:
  stage: deploy
  image: alpine/helm:3.16.3
  tags:
    - runcell
  allow_failure: true
  variables:
    KUBECONFIG: /tmp/kubeconfig
  before_script:
    # Alpine-based image: inject CA for Helm/K8s API calls through MITM proxy
    - mkdir -p /usr/local/share/ca-certificates
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - cat /usr/local/share/ca-certificates/switch-ca.crt >> /etc/ssl/certs/ca-certificates.crt
    - |
      if [ -z "${KUBE_CONFIG_OVAS}" ]; then
        echo "ERROR: KUBE_CONFIG_OVAS CI variable not set"
        echo "Generate with: base64 -i ~/.kube/ovas-ai-prod.yaml | tr -d '\\n'"
        echo "Add to CI/CD > Variables"
        exit 1
      fi
    - echo "${KUBE_CONFIG_OVAS}" | base64 -d > /tmp/kubeconfig
    - chmod 600 /tmp/kubeconfig

deploy-server:
  extends: .deploy-base
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Deploying ch-server:${VERSION} to ${KUBE_NAMESPACE}"
      helm upgrade --install ch-server ./ch-server/charts/ch-server \
        --namespace ${KUBE_NAMESPACE} \
        --set image.tag=${VERSION} \
        --set virtualService.enabled=true \
        --set virtualService.gateway=istio-ingress/switch-wildcard-ingress \
        --set virtualService.host=chapterhouse.switchcraft.pd.internal \
        --wait --timeout=120s
      echo "Deployment complete"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/**/*
        - ch-server/charts/**/*
  needs:
    - job: build-server

deploy-web:
  extends: .deploy-base
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Deploying ch-web:${VERSION} to ${KUBE_NAMESPACE}"
      helm upgrade --install ch-web ./ch-web/charts/ch-web \
        --namespace ${KUBE_NAMESPACE} \
        --set image.tag=${VERSION} \
        --wait --timeout=120s
      echo "Deployment complete"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-web/**/*
        - ch-web/charts/**/*
  needs:
    - job: build-web
