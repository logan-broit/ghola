# =============================================================================
# Chapterhouse GitLab CI/CD Pipeline
# =============================================================================
# Tests code, builds Docker images, packages Helm charts, and deploys to K8s
# =============================================================================

stages:
  - test
  - build
  - publish
  - deploy

variables:
  GO_VERSION: "1.24"
  REGISTRY: ats-dev.nexus.switchnet.nv/chapterhouse
  IMAGE_PREFIX: ${REGISTRY}
  KUBE_NAMESPACE: ch-system

# =============================================================================
# Test Stage
# =============================================================================
test:
  stage: test
  image: golang:${GO_VERSION}-alpine
  tags:
    - chapterhouse
  before_script:
    - apk add --no-cache ca-certificates
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - update-ca-certificates
  script:
    - cd ch-server
    - go mod download
    - go vet ./...
    - go test ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ch-server/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/**/*
    - if: $CI_COMMIT_TAG

# =============================================================================
# Build Stage - Docker Images
# =============================================================================
.docker-build:
  stage: build
  image: docker:27
  tags:
    - chapterhouse
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=ats-dev.nexus.switchnet.nv"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    # Verify credentials are set
    - |
      if [ -z "${NEXUS_USER}" ]; then
        echo "ERROR: NEXUS_USER CI variable not set"
        echo "Go to Settings > CI/CD > Variables and add NEXUS_USER"
        exit 1
      fi
      if [ -z "${NEXUS_PASSWORD}" ]; then
        echo "ERROR: NEXUS_PASSWORD CI variable not set"
        echo "Go to Settings > CI/CD > Variables and add NEXUS_PASSWORD"
        exit 1
      fi
    # Inject corporate CA bundle for MITM proxy
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - update-ca-certificates
    # Wait for Docker daemon to be ready
    - |
      echo "Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker is ready!"
          break
        fi
        echo "Waiting... ($i/30)"
        sleep 2
      done
      docker info || exit 1
    # Login to Nexus registry
    - echo "${NEXUS_PASSWORD}" | docker login -u "${NEXUS_USER}" --password-stdin ats-dev.nexus.switchnet.nv
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

build-server:
  extends: .docker-build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/**/*
        - ca-bundle.pem
  script:
    - |
      VERSION=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}
      docker build \
        -f ch-server/Dockerfile \
        -t ${IMAGE_PREFIX}/ch-server:${VERSION} \
        -t ${IMAGE_PREFIX}/ch-server:latest \
        ch-server/
      docker push ${IMAGE_PREFIX}/ch-server:${VERSION}
      docker push ${IMAGE_PREFIX}/ch-server:latest

build-web:
  extends: .docker-build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-web/**/*
        - ca-bundle.pem
  script:
    - |
      VERSION=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}
      docker build \
        -f ch-web/Dockerfile \
        -t ${IMAGE_PREFIX}/ch-web:${VERSION} \
        -t ${IMAGE_PREFIX}/ch-web:latest \
        ch-web/
      docker push ${IMAGE_PREFIX}/ch-web:${VERSION}
      docker push ${IMAGE_PREFIX}/ch-web:latest

# =============================================================================
# Publish Stage - Helm Charts
# =============================================================================
publish-helm-charts:
  stage: publish
  image: alpine:3.21
  tags:
    - chapterhouse
  before_script:
    # Alpine: append CA to trust store before apk can fetch through MITM proxy
    - mkdir -p /usr/local/share/ca-certificates
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - cat /usr/local/share/ca-certificates/switch-ca.crt >> /etc/ssl/certs/ca-certificates.crt
    - apk add --no-cache curl helm ca-certificates
    - update-ca-certificates
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG}"
      else
        VERSION="0.0.0-${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Chart version: ${VERSION}"

      mkdir -p dist
      for chart in ch-server/charts/ch-server ch-web/charts/ch-web; do
        if [ ! -f "${chart}/Chart.yaml" ]; then
          echo "Skipping ${chart} (no Chart.yaml)"
          continue
        fi
        chart_name=$(basename "$chart")
        echo "Packaging ${chart_name}..."
        helm package "$chart" --version "${VERSION}" --app-version "${VERSION}" -d dist/
      done
  artifacts:
    paths:
      - dist/*.tgz
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/charts/**/*
        - ch-web/charts/**/*

# =============================================================================
# Deploy Stage
# =============================================================================
# Requires CI variable: KUBE_CONFIG (base64-encoded kubeconfig)
# Generate with: base64 -i ~/.kube/your-cluster.yaml | tr -d '\n'
# =============================================================================

.deploy-base:
  stage: deploy
  image: alpine/helm:3.16.3
  tags:
    - chapterhouse
  allow_failure: true
  variables:
    KUBECONFIG: /tmp/kubeconfig
  before_script:
    # Alpine-based image: inject CA for Helm/K8s API calls through MITM proxy
    - mkdir -p /usr/local/share/ca-certificates
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - cat /usr/local/share/ca-certificates/switch-ca.crt >> /etc/ssl/certs/ca-certificates.crt
    - |
      if [ -z "${KUBE_CONFIG}" ]; then
        echo "ERROR: KUBE_CONFIG CI variable not set"
        echo "Generate with: base64 -i ~/.kube/your-cluster.yaml | tr -d '\\n'"
        echo "Add to CI/CD > Variables"
        exit 1
      fi
    - echo "${KUBE_CONFIG}" | base64 -d > /tmp/kubeconfig
    - chmod 600 /tmp/kubeconfig

deploy-server:
  extends: .deploy-base
  script:
    - |
      VERSION=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}
      echo "Deploying ch-server:${VERSION} to ${KUBE_NAMESPACE}"
      helm upgrade --install ch-server ./ch-server/charts/ch-server \
        --namespace ${KUBE_NAMESPACE} \
        --set image.tag=${VERSION} \
        --wait --timeout=120s
      echo "Deployment complete"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/**/*
  needs:
    - job: build-server

deploy-web:
  extends: .deploy-base
  script:
    - |
      VERSION=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}
      echo "Deploying ch-web:${VERSION} to ${KUBE_NAMESPACE}"
      helm upgrade --install ch-web ./ch-web/charts/ch-web \
        --namespace ${KUBE_NAMESPACE} \
        --set image.tag=${VERSION} \
        --wait --timeout=120s
      echo "Deployment complete"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-web/**/*
  needs:
    - job: build-web
