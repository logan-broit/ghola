# =============================================================================
# Chapterhouse GitLab CI/CD Pipeline
# =============================================================================
# Tests code, builds Docker images, packages Helm charts, and deploys to K8s
# =============================================================================

stages:
  - test
  - build
  - publish
  - deploy

variables:
  GO_VERSION: "1.24"
  REGISTRY: ats-dev.nexus.switchnet.nv/chapterhouse
  IMAGE_PREFIX: ${REGISTRY}
  KUBE_NAMESPACE: ch-system

# =============================================================================
# Test Stage
# =============================================================================
test:
  stage: test
  image: golang:${GO_VERSION}-alpine
  before_script:
    # Inject CA bundle before apk — MITM proxy intercepts Alpine mirror TLS
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - cat /usr/local/share/ca-certificates/switch-ca.crt >> /etc/ssl/certs/ca-certificates.crt
    - apk add --no-cache ca-certificates
    - update-ca-certificates
  script:
    - cd ch-server
    - go mod download
    - go vet ./...
    - go test ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ch-server/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/**/*
    - if: $CI_COMMIT_TAG

# =============================================================================
# Build Stage - Kaniko (no DIND required, works on K8s runners)
# =============================================================================
.kaniko-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    # Verify credentials are set
    - |
      if [ -z "${NEXUS_USER}" ]; then
        echo "ERROR: NEXUS_USER CI variable not set"
        exit 1
      fi
      if [ -z "${NEXUS_PASSWORD}" ]; then
        echo "ERROR: NEXUS_PASSWORD CI variable not set"
        exit 1
      fi
    # Inject corporate CA bundle for MITM proxy (Kaniko uses /kaniko/ssl/certs)
    - mkdir -p /kaniko/ssl/certs
    - cat ca-bundle.pem >> /kaniko/ssl/certs/additional-ca-cert-bundle.crt
    # Create Kaniko Docker config for registry auth
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"ats-dev.nexus.switchnet.nv\":{\"auth\":\"$(echo -n ${NEXUS_USER}:${NEXUS_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

build-server:
  extends: .kaniko-build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/**/*
        - ca-bundle.pem
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Building ch-server:${VERSION} with Kaniko"
    - /kaniko/executor
      --context=${CI_PROJECT_DIR}/ch-server
      --dockerfile=${CI_PROJECT_DIR}/ch-server/Dockerfile
      --destination=${IMAGE_PREFIX}/ch-server:${VERSION}
      --destination=${IMAGE_PREFIX}/ch-server:latest
      --cache=true
      --custom-platform=linux/amd64
      --insecure-registry=ats-dev.nexus.switchnet.nv

build-web:
  extends: .kaniko-build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-web/**/*
        - ca-bundle.pem
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Building ch-web:${VERSION} with Kaniko"
    - /kaniko/executor
      --context=${CI_PROJECT_DIR}/ch-web
      --dockerfile=${CI_PROJECT_DIR}/ch-web/Dockerfile
      --destination=${IMAGE_PREFIX}/ch-web:${VERSION}
      --destination=${IMAGE_PREFIX}/ch-web:latest
      --cache=true
      --custom-platform=linux/amd64
      --insecure-registry=ats-dev.nexus.switchnet.nv

# =============================================================================
# Publish Stage - Helm Charts
# =============================================================================
publish-helm-charts:
  stage: publish
  image: alpine:3.21
  before_script:
    # Alpine: append CA to trust store before apk can fetch through MITM proxy
    - mkdir -p /usr/local/share/ca-certificates
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - cat /usr/local/share/ca-certificates/switch-ca.crt >> /etc/ssl/certs/ca-certificates.crt
    - apk add --no-cache curl helm ca-certificates
    - update-ca-certificates
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="0.0.0-${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Chart version: ${VERSION}"

      mkdir -p dist
      for chart in ch-server/charts/ch-server ch-web/charts/ch-web; do
        if [ ! -f "${chart}/Chart.yaml" ]; then
          echo "Skipping ${chart} (no Chart.yaml)"
          continue
        fi
        chart_name=$(basename "$chart")
        echo "Packaging ${chart_name}..."
        helm package "$chart" --version "${VERSION}" --app-version "${VERSION}" -d dist/
      done
  artifacts:
    paths:
      - dist/*.tgz
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/charts/**/*
        - ch-web/charts/**/*

# =============================================================================
# Deploy Stage
# =============================================================================
# Requires CI variable: KUBE_CONFIG (base64-encoded kubeconfig)
# Generate with: base64 -i ~/.kube/your-cluster.yaml | tr -d '\n'
# =============================================================================

.deploy-base:
  stage: deploy
  image: alpine/helm:3.16.3
  allow_failure: true
  variables:
    KUBECONFIG: /tmp/kubeconfig
  before_script:
    # Alpine-based image: inject CA for Helm/K8s API calls through MITM proxy
    - mkdir -p /usr/local/share/ca-certificates
    - cp ca-bundle.pem /usr/local/share/ca-certificates/switch-ca.crt
    - cat /usr/local/share/ca-certificates/switch-ca.crt >> /etc/ssl/certs/ca-certificates.crt
    - |
      if [ -z "${KUBE_CONFIG}" ]; then
        echo "ERROR: KUBE_CONFIG CI variable not set"
        echo "Generate with: base64 -i ~/.kube/your-cluster.yaml | tr -d '\\n'"
        echo "Add to CI/CD > Variables"
        exit 1
      fi
    - echo "${KUBE_CONFIG}" | base64 -d > /tmp/kubeconfig
    - chmod 600 /tmp/kubeconfig

deploy-server:
  extends: .deploy-base
  when: manual
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Deploying ch-server:${VERSION} to ${KUBE_NAMESPACE}"
      helm upgrade --install ch-server ./ch-server/charts/ch-server \
        --namespace ${KUBE_NAMESPACE} \
        --set image.tag=${VERSION} \
        --set virtualService.enabled=true \
        --set virtualService.gateway=istio-ingress/switch-wildcard-ingress \
        --set virtualService.host=chapterhouse.switchcraft.pd.internal \
        --wait --timeout=120s
      echo "Deployment complete"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-server/**/*
  needs:
    - job: build-server

deploy-web:
  extends: .deploy-base
  when: manual
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Deploying ch-web:${VERSION} to ${KUBE_NAMESPACE}"
      helm upgrade --install ch-web ./ch-web/charts/ch-web \
        --namespace ${KUBE_NAMESPACE} \
        --set image.tag=${VERSION} \
        --wait --timeout=120s
      echo "Deployment complete"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ch-web/**/*
  needs:
    - job: build-web
