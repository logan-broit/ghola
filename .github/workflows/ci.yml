name: ci

on:
  push:
    branches: [main]
  pull_request:

# To run on the NUC self-hosted runner instead, change `runs-on:` to
# `[self-hosted, linux, x64]` (or whatever labels you registered).
# ubuntu-latest is the safe default for the public repo today.

jobs:
  go-root:
    name: go (root module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  go-chapterhouse:
    name: go (chapterhouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _chapterhouse/ch-server
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: _chapterhouse/ch-server/go.sum
      - run: go vet ./...
      - run: go build ./...
      # Postgres-dependent packages (handler, repository, consolidation,
      # semantic) self-provision pgvector/pgvector:pg17 via
      # testcontainers — the runner's Docker daemon is all they need.
      - run: go test -race -timeout 20m ./...

  go-chweb:
    name: go (ch-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _chapterhouse/ch-web
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: _chapterhouse/ch-web/go.sum
      - run: go vet ./...
      - run: go build ./...

  python-mentat:
    name: pytest (mentat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mentat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # torch is a hard dep (pooler.py). Pull the CPU-only wheel first so
      # the editable install below doesn't drag in the ~2GB CUDA build.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      # Skip the integration test (test_cluster_endpoint.py); it needs a
      # live Postgres with the chapterhouse schemas — out of scope here.
      - run: pytest tests -q -m "not integration"

  python-qa:
    name: pytest (lme-qa)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench/longmemeval/qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No torch here — the QA stage is the anthropic SDK plus pure-stdlib
      # context/prompt/aggregation logic. The SDK-boundary tests run a real
      # anthropic client against a stdlib http.server fake; no network egress.
      - run: pip install -e '.[dev]'
      - run: pytest tests -q
