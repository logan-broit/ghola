name: ci

on:
  push:
    branches: [main]
  pull_request:

# To run on the NUC self-hosted runner instead, change `runs-on:` to
# `[self-hosted, linux, x64]` (or whatever labels you registered).
# ubuntu-latest is the safe default for the public repo today.

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      # Postgres-dependent chapterhouse packages (handler, repository,
      # consolidation, semantic) self-provision pgvector/pgvector:pg17
      # via testcontainers — the runner's Docker daemon is all they need.
      - run: go test -race -timeout 20m ./...

  python:
    name: pytest (mentat + truthsayer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # torch is a hard dep of both. Pull the CPU-only wheel first so
      # the editable installs below don't drag in the ~2GB CUDA build.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e './mentat[dev]' -e './truthsayer[dev]'
      # Skip the integration test (test_cluster_endpoint.py); it needs a
      # live Postgres with the chapterhouse schemas — out of scope here.
      # truthsayer has no tests yet; the install above is its check.
      - run: pytest tests -q -m "not integration"
        working-directory: mentat

  python-qa:
    name: pytest (lme-qa)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench/longmemeval/qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No torch here — the QA stage is the anthropic SDK plus pure-stdlib
      # context/prompt/aggregation logic. The SDK-boundary tests run a real
      # anthropic client against a stdlib http.server fake; no network egress.
      - run: pip install -e '.[dev]'
      - run: pytest tests -q
