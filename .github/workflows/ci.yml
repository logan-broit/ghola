name: ci

on:
  push:
    branches: [main]
  pull_request:

# To run on the NUC self-hosted runner instead, change `runs-on:` to
# `[self-hosted, linux, x64]` (or whatever labels you registered).
# ubuntu-latest is the safe default for the public repo today.

jobs:
  go-root:
    name: go (root module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  go-chapterhouse:
    name: go (chapterhouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _chapterhouse/ch-server
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: _chapterhouse/ch-server/go.sum
      - run: go vet ./...
      - run: go build ./...
      # Skip packages that require a live Postgres + migrations. They
      # pass locally via `make test` / `make smoke-predictive`; wiring
      # them into CI needs a postgres service + migration step (open
      # work for v0.1+).
      - run: go test ./internal/auth/... ./internal/config/... ./internal/embedding/... ./internal/mneme/... ./internal/middleware/... ./internal/primitives/... ./internal/secrets/...

  go-chweb:
    name: go (ch-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _chapterhouse/ch-web
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: _chapterhouse/ch-web/go.sum
      - run: go vet ./...
      - run: go build ./...
