[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lme-qa"
version = "0.1.0"
description = "Reader+judge QA-accuracy stage for LongMemEval-S on top of ghola retrieve results"
requires-python = ">=3.12"
# anthropic is the only runtime dep: the Batches API client for the
# Opus 4.8 reader+judge submissions. Context building, prompt rendering,
# and aggregation are pure stdlib.
dependencies = ["anthropic>=0.69"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# matplotlib is OPTIONAL: lme-qa-rd's PNG is best-effort. The markdown table is
# the must-have and ships without it; install '.[plot]' to also get rd-curve.png.
plot = ["matplotlib>=3.7"]

[project.scripts]
lme-qa-run = "lme_qa.cli:run_main"
lme-qa-judge = "lme_qa.cli:judge_main"
lme-qa-sweep = "lme_qa.sweep:sweep_main"
lme-qa-rd = "lme_qa.rd_aggregate:rd_main"

[tool.setuptools]
packages = ["lme_qa"]

[tool.pytest.ini_options]
# Put the package root on sys.path so `from tests.fake_batches_server import ...`
# resolves (the tests/ helper module is imported as a package member).
pythonpath = ["."]
testpaths = ["tests"]
