[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mentat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "torch>=2.4",
    "numpy>=1.26",
    "hdbscan>=0.8.38",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["mentat"]
