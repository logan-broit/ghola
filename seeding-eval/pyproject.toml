[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seeding-eval"
version = "0.1.0"
requires-python = ">=3.12"
description = "Seeding eval harness — pulls GitHub corpus, ingests via import-logs, runs H1/H2/H3 metrics against ghola recall."
dependencies = [
    "PyGithub>=2.4",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
seeding-extract = "seeding_eval.extract:main"
seeding-eval-run = "seeding_eval.eval:main"

[tool.hatch.build.targets.wheel]
packages = ["seeding_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires docker-compose"]
