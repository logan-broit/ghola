apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: memory-db
  namespace: ch-system
  labels:
    app.kubernetes.io/name: memory-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: chapterhouse
spec:
  instances: 1

  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      work_mem: "2MB"
      maintenance_work_mem: "64MB"
      log_statement: "none"
      log_min_duration_statement: "1000"

  bootstrap:
    initdb:
      database: memories
      owner: memory_api
      secret:
        name: memory-db-credentials

  storage:
    size: 10Gi
    storageClass: local-path

  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 768Mi
      cpu: 200m
