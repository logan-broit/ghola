# Example: Qdrant vector database deployment
# Creates a single-instance Qdrant deployment with persistent storage.
#
# For production, consider the Qdrant Helm chart:
# https://github.com/qdrant/qdrant-helm
#
# Usage: kubectl apply -f qdrant.yaml -n <namespace>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chapterhouse-qdrant
  labels:
    app: chapterhouse-qdrant
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required for RWO PVCs
  selector:
    matchLabels:
      app: chapterhouse-qdrant
  template:
    metadata:
      labels:
        app: chapterhouse-qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.16.0
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chapterhouse-qdrant-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chapterhouse-qdrant-data
spec:
  storageClassName: ceph-rbd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chapterhouse-qdrant
spec:
  selector:
    app: chapterhouse-qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
