apiVersion: v1
kind: ConfigMap
metadata:
  name: ch-server-config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  DATABASE_HOST: "chapterhouse-db-rw.ch-system.svc"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "memories"
  DATABASE_MAX_CONNS: "25"
  DATABASE_MIN_CONNS: "5"
  QDRANT_HOST: "chapterhouse-qdrant.ch-system.svc"
  QDRANT_GRPC_PORT: "6334"
  QDRANT_HTTP_PORT: "6333"
  QDRANT_COLLECTION: "memories"
  EMBEDDING_PROVIDER: "openai"
  EMBEDDING_URL: "https://api.openai.com"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_DIMENSIONS: "768"
  AUTH_PROVIDER: "default"
  AUTH_DEFAULT_USER: "00000000-0000-0000-0000-000000000001"
  CORS_ORIGINS: "*"
