<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; src: url('{{FONT_DIR}}/inter-400.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Inter'; src: url('{{FONT_DIR}}/inter-500.ttf') format('truetype'); font-weight: 500; }
  @font-face { font-family: 'Inter'; src: url('{{FONT_DIR}}/inter-600.ttf') format('truetype'); font-weight: 600; }
  @font-face { font-family: 'Inter'; src: url('{{FONT_DIR}}/inter-700.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'JetBrains Mono'; src: url('{{FONT_DIR}}/jbmono-400.ttf') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'Inter', sans-serif; }

  .report {
    width: 800px;
    padding: 40px;
    background: linear-gradient(180deg, #0d0d14 0%, #0a0a0f 100%);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid #1a1a2e;
  }

  .header-left h1 {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }

  .header-left .subtitle {
    font-size: 13px;
    color: #8888aa;
    font-weight: 400;
  }

  .header-right {
    text-align: right;
    font-size: 12px;
    color: #6666aa;
    font-family: 'JetBrains Mono', monospace;
  }

  .header-right .version { color: #44ddaa; font-weight: 600; }

  /* KPI Cards */
  .kpi-row {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
  }

  .kpi-card {
    flex: 1;
    background: #12121e;
    border: 1px solid #1a1a2e;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }

  .kpi-value {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .kpi-value.green { color: #44ddaa; }
  .kpi-value.blue { color: #4488ff; }
  .kpi-value.amber { color: #ffaa44; }
  .kpi-value.purple { color: #aa66ff; }

  .kpi-label {
    font-size: 11px;
    color: #6666aa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Charts */
  .chart-section {
    margin-bottom: 32px;
  }

  .chart-title {
    font-size: 14px;
    font-weight: 600;
    color: #ccccee;
    margin-bottom: 16px;
    padding-left: 8px;
    border-left: 3px solid #4488ff;
  }

  .bar-chart {
    background: #12121e;
    border: 1px solid #1a1a2e;
    border-radius: 8px;
    padding: 20px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
  }

  .bar-label {
    width: 200px;
    font-size: 11px;
    color: #aaaacc;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bar-track {
    flex: 1;
    height: 20px;
    background: #1a1a2e;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  .bar-fill.score { background: linear-gradient(90deg, #4488ff, #44ddaa); }
  .bar-fill.coverage { background: linear-gradient(90deg, #aa66ff, #ff66aa); }
  .bar-fill.advantage-high { background: #44ddaa; }
  .bar-fill.advantage-medium { background: #ffaa44; }
  .bar-fill.advantage-none { background: #ff4466; }

  .bar-value {
    width: 50px;
    text-align: right;
    font-size: 12px;
    font-weight: 600;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Comparison Table */
  .comparison {
    background: #12121e;
    border: 1px solid #1a1a2e;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 32px;
  }

  .comp-row {
    display: flex;
    padding: 12px 0;
    border-bottom: 1px solid #1a1a2e;
    align-items: flex-start;
  }

  .comp-row:last-child { border-bottom: none; }

  .comp-query {
    width: 220px;
    font-size: 12px;
    font-weight: 600;
    color: #ccccee;
  }

  .comp-without {
    flex: 1;
    font-size: 11px;
    color: #ff6666;
    padding: 0 12px;
  }

  .comp-with {
    flex: 1;
    font-size: 11px;
    color: #44ddaa;
    padding: 0 12px;
  }

  .comp-header {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 10px;
    padding-bottom: 8px;
  }

  .comp-header .comp-without { color: #ff6666; }
  .comp-header .comp-with { color: #44ddaa; }

  /* Insight Box */
  .insight-box {
    background: linear-gradient(135deg, #12121e 0%, #1a1230 100%);
    border: 1px solid #2a1a4e;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }

  .insight-title {
    font-size: 13px;
    font-weight: 600;
    color: #aa66ff;
    margin-bottom: 8px;
  }

  .insight-body {
    font-size: 12px;
    color: #ccccdd;
    line-height: 1.6;
  }

  .footer {
    text-align: center;
    font-size: 10px;
    color: #444466;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #1a1a2e;
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>
<div class="report">
  {{CONTENT}}
</div>
</body>
</html>
