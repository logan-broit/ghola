<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Chapterhouse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script>window.CH_API_BASE = ''; window.CH_MOCK_MODE = false;</script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">Chapterhouse</div>
            <div class="sidebar-subtitle">Agentic Memory</div>
            <nav>
                <div class="nav-section">
                    <div class="nav-section-title">Overview</div>
                    <a class="nav-item" href="admin.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                        Dashboard
                    </a>
                </div>
                <div class="nav-section" data-admin-only>
                    <div class="nav-section-title">Admin</div>
                    <a class="nav-item" href="users.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        Users
                    </a>
                    <a class="nav-item" href="keys.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                        API Keys
                    </a>
                    <a class="nav-item" href="audit.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                        Audit Log
                    </a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Personal</div>
                    <a class="nav-item" href="my-keys.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                        My API Keys
                    </a>
                    <a class="nav-item" href="my-activity.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                        My Activity
                    </a>
                    <a class="nav-item" href="settings.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        Settings
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">--</div>
                    <div class="user-details">
                        <div class="user-name" id="user-name">Loading...</div>
                        <div class="user-role" id="user-role">-</div>
                    </div>
                </div>
                <button class="btn btn-secondary" style="width:100%;margin-top:12px" onclick="logout()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Sign Out
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div class="page-header-content">
                    <h1 class="page-title">Dashboard</h1>
                </div>
            </div>

            <!-- Row 1: Stats -->
            <div class="stats-row" id="stats-row"></div>

            <!-- Row 2: Activity -->
            <div>
                <div class="card dashboard-activity">
                    <div class="card-header">
                        <h3 class="card-title">Recent Activity</h3>
                        <a href="audit.html" class="text-muted" style="font-size:11px;text-decoration:none">View all</a>
                    </div>
                    <div class="card-body" style="padding:0">
                        <ul class="activity-list" id="activity-list">
                            <li class="text-muted" style="padding:14px">Loading...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        const ch = window.chapterhouse;

        function statCard(label, value, sub, accent) {
            return `<div class="stat-card" data-accent="${accent}">
                <div class="stat-label">${label}</div>
                <div class="stat-value">${value}</div>
                ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
            </div>`;
        }

        function activityIconClass(action) {
            if (action.startsWith('mcp.')) return 'memory';
            if (action === 'login' || action === 'logout') return 'success';
            if (action === 'create') return 'api';
            return 'user';
        }

        async function loadDashboard() {
            try {
                const [s, audit] = await Promise.all([
                    ch.stats.get(),
                    ch.adminAudit.list({ limit: 8 }),
                ]);

                // Stats row
                document.getElementById('stats-row').innerHTML = [
                    statCard('Users', s.active_users, `${s.admin_users} admins`, 'blue'),
                    statCard('API Keys', s.active_api_keys, null, 'purple'),
                    statCard('Sessions', s.active_sessions, null, 'green'),
                ].join('');

                // Activity
                const actList = document.getElementById('activity-list');
                if (audit.entries && audit.entries.length > 0) {
                    actList.innerHTML = audit.entries.map(e => `
                        <li class="activity-item">
                            <div class="activity-icon ${activityIconClass(e.action)}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                                </svg>
                            </div>
                            <div class="activity-content">
                                <div class="activity-text"><strong>${e.actor_username || ch.truncateId(e.actor_id)}</strong> ${e.action} ${e.resource_type}</div>
                                <div class="activity-time">${ch.formatRelativeTime(e.created_at)}</div>
                            </div>
                        </li>
                    `).join('');
                } else {
                    actList.innerHTML = '<li class="text-muted" style="padding:14px">No recent activity</li>';
                }
            } catch (err) {
                console.error('Dashboard load error:', err);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
