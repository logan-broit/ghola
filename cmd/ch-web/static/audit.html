        <main class="main-content">
            <div class="page-header">
                <div class="page-header-content">
                    <h1 class="page-title">Audit Log</h1>

                </div>
                <div class="page-actions">
                    <button class="btn btn-secondary" onclick="exportCSV()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Export CSV
                    </button>
                    <button class="btn btn-secondary" onclick="loadAudit()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        Refresh

                </div>
            </div>

            <div class="search-bar">
                <select class="form-select" id="action-filter" onchange="currentOffset=0;loadAudit()" style="max-width:220px">
                    <option value="">All Actions</option>
                    <optgroup label="Admin Actions">
                        <option value="login">login</option>
                        <option value="logout">logout</option>
                        <option value="create">create</option>
                        <option value="update">update</option>
                        <option value="delete">delete</option>
                        <option value="revoke">revoke</option>
                        <option value="change_password">change_password</option>
                    </optgroup>
                    <optgroup label="MCP Tools">
                        <option value="mcp.remember">mcp.remember</option>
                        <option value="mcp.recall">mcp.recall</option>
                        <option value="mcp.forget">mcp.forget</option>
                        <option value="mcp.list_memories">mcp.list_memories</option>
                        <option value="mcp.share_memory">mcp.share_memory</option>
                        <option value="mcp.export_memories">mcp.export_memories</option>
                    </optgroup>
                </select>
                <select class="form-select" id="resource-filter" onchange="currentOffset=0;loadAudit()" style="max-width:200px">
                    <option value="">All Resources</option>
                    <option value="user">user</option>
                    <option value="api_key">api_key</option>
                    <option value="session">session</option>
                    <option value="memory">memory</option>
                </select>
            </div>

            <div class="card">
                <div id="audit-table"></div>
                <div id="audit-pagination" style="padding:0 20px"></div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        const ch = window.chapterhouse;
        let currentOffset = 0;
        let allEntries = [];
        const LIMIT = 50;

        async function loadAudit() {
            const action = document.getElementById('action-filter').value;
            const resourceType = document.getElementById('resource-filter').value;
            try {
                const params = { limit: LIMIT, offset: currentOffset };
                if (action) params.action = action;
                if (resourceType) params.resource_type = resourceType;
                const result = await ch.adminAudit.list(params);
                allEntries = result.entries || [];

                renderTable('audit-table', [
                    { label: 'Time', render: e => `<span class="text-muted" style="font-size:12px;white-space:nowrap" title="${ch.formatDate(e.created_at)}">${formatShortTime(e.created_at)}</span>` },
                    { label: 'Actor', render: e => `<span class="text-cyan" style="font-size:13px">${e.actor_username || ch.truncateId(e.actor_id)}</span>` },
                    { label: 'Action', render: e => actionBadge(e.action) },
                    { label: 'Resource', render: e => `${resourceBadge(e.resource_type)}${e.target_username ? ` <span class="text-muted" style="font-size:12px">${e.target_username}</span>` : ''}` },
                    { label: 'Details', render: e => renderDetails(e) },
                    { label: 'Client', render: e => `<span class="text-muted" style="font-size:11px;white-space:nowrap">${parseClient(e.user_agent)}</span>` },
                    { label: 'IP', render: e => `<span class="text-muted" style="font-size:12px">${e.ip_address || '-'}</span>` },
                ], allEntries, { emptyTitle: 'No audit entries', emptyText: 'No audit log entries match your filters.' });

                renderPagination('audit-pagination', result.total || allEntries.length, currentOffset, LIMIT, (offset) => {
                    currentOffset = offset;
                    loadAudit();
                });
            } catch (err) {
                toast.error('Failed to load audit log');
            }
        }

        function formatShortTime(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function renderDetails(entry) {
            if (!entry.details) return '<span class="text-muted">-</span>';
            const d = entry.details;
            const parts = [];
            // MCP tool-specific fields
            if (d.query) parts.push(`query: "${truncate(d.query, 40)}"`);
            if (d.fact_preview) parts.push(`"${truncate(d.fact_preview, 40)}"`);
            if (d.memory_type) parts.push(d.memory_type);
            if (d.mode) parts.push(d.mode);
            if (d.fact_id) parts.push(`#${d.fact_id}`);
            if (d.tags_count) parts.push(`${d.tags_count} tags`);
            if (d.tags_filter) parts.push(`tags: ${d.tags_filter}`);
            if (d.duration_ms !== undefined) parts.push(`${d.duration_ms}ms`);
            if (d.is_error) parts.push('<span style="color:var(--accent-red)">error</span>');
            if (parts.length === 0) {
                const str = JSON.stringify(d);
                if (str === '{}') return '<span class="text-muted">-</span>';
                return `<span class="text-muted" style="font-size:11px" title="${escapeHtml(str)}">${truncate(str, 40)}</span>`;
            }
            return `<span class="text-muted" style="font-size:11px" title="${escapeHtml(JSON.stringify(d))}">${parts.join(' · ')}</span>`;
        }

        function truncate(str, max) {
            return str.length > max ? str.slice(0, max - 1) + '…' : str;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function parseClient(ua) {
            if (!ua) return '-';
            // Claude Code: claude-code/2.1.42 (claude-vscode, agent-sdk/0.2.42)
            const ccMatch = ua.match(/claude-code\/([\d.]+)\s*\(([^)]*)\)/);
            if (ccMatch) {
                const env = ccMatch[2].includes('vscode') ? 'VS Code' : ccMatch[2].includes('cli') ? 'CLI' : ccMatch[2].split(',')[0];
                return `Claude Code ${ccMatch[1]} (${env})`;
            }
            if (ua.includes('claude-code')) return 'Claude Code';
            if (ua.includes('ClaudeDesktop')) return 'Claude Desktop';
            if (ua.includes('claude-ai/')) return ua.match(/claude-ai\/[\d.]+/)?.[0] || 'Claude';
            // Browsers
            if (ua.includes('Firefox/')) return 'Firefox';
            if (ua.includes('Edg/')) return 'Edge';
            if (ua.includes('Chrome/') && !ua.includes('Edg/')) return 'Chrome';
            if (ua.includes('Safari/') && !ua.includes('Chrome/')) return 'Safari';
            // Tools
            if (ua.startsWith('curl/')) return ua;
            if (ua.length > 30) return truncate(ua, 20);
            return ua;
        }

        function exportCSV() {
            if (!allEntries.length) { toast.error('No data to export'); return; }
            const headers = ['Timestamp', 'Actor', 'Action', 'Resource Type', 'Resource ID', 'IP Address', 'Details'];
            const rows = allEntries.map(e => [
                e.created_at,
                e.actor_username || e.actor_id || '',
                e.action,
                e.resource_type,
                e.resource_id || '',
                e.ip_address || '',
                e.details ? JSON.stringify(e.details) : '',
            ]);
            const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ch-audit-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            toast.success('CSV exported');
        }

        loadAudit();
    </script>
</body>
</html>
